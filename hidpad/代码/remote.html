<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171b22"><title>HoloCubic 网页手柄</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:#f7f2e8;background:#11151b}
*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:28px 20px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.header-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}.language-control{display:flex;align-items:center;gap:8px;color:#aeb6c3;font-size:13px}.language-control select{width:148px;min-height:36px;padding:4px 8px;font-size:13px}.eyebrow{color:#f8c96a;font-size:13px;letter-spacing:2px;margin:0}h1{font-size:28px;margin:4px 0 0}p{color:#aeb6c3}.badge{border:1px solid #3e4652;border-radius:30px;padding:6px 12px;color:#b6becb;font-size:13px;white-space:nowrap}.badge.active{color:#a4efcb;border-color:#467a64;background:#182e27}
.panel{background:#1b2029;border:1px solid #343b47;border-radius:20px;padding:20px;margin-top:20px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border-radius:12px;border:1px solid #495160;min-height:48px;padding:10px 16px;background:#282f3b;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:3px solid #f8c96a;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.primary{background:#f4c16a;color:#21190d;border-color:#f4c16a;font-weight:750}#message{min-height:24px;margin:12px 0 0;font-size:14px}#current{margin:0 0 12px;color:#e4e7ec;font-size:15px}select{flex:1;min-width:160px;width:100%}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px 0 18px;align-items:center}.dpad{display:grid;grid-template:repeat(3,64px)/repeat(3,64px);gap:5px;justify-content:center}.dpad button{font-size:27px;padding:0}.up{grid-area:1/2}.left{grid-area:2/1}.right{grid-area:2/3}.down{grid-area:3/2}.hub{grid-area:2/2;background:#212732;border-radius:14px;display:grid;place-items:center;color:#697585;font-size:22px}.face{display:grid;grid-template:repeat(3,60px)/repeat(3,60px);gap:5px;justify-content:center}.face button{border-radius:50%;font-weight:750;font-size:22px;padding:0}.x{grid-area:2/1}.y{grid-area:1/2}.b{grid-area:2/3}.a{grid-area:3/2;color:#f8c96a;border-color:#a1814d}.shoulders{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}.shoulders button{min-height:52px;border-radius:18px 18px 10px 10px;font-weight:750}.aux{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.aux button{font-size:14px;padding:10px 4px}.game-button{touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 #101319;transition:background .06s,transform .06s}.game-button.pressed{background:#f4c16a;color:#21190d;transform:translateY(3px);box-shadow:0 1px 0 #101319;border-color:#f4c16a}.hint{font-size:13px;line-height:1.8;margin-bottom:0}.footer{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;min-height:24px;font-size:13px;color:#7e8a9c}.footer .author{position:absolute;left:50%;transform:translateX(-50%);margin:0;color:#8d97a6;white-space:nowrap}a{color:#f8c96a}#backLauncher{background:transparent}
@media(max-width:520px){main{padding:20px 14px}.panel{padding:16px}.pad{gap:12px}.dpad{grid-template:repeat(3,52px)/repeat(3,52px);gap:4px}.face{grid-template:repeat(3,48px)/repeat(3,48px);gap:4px}h1{font-size:24px}.badge{padding:5px 8px;font-size:12px}}
@media(max-width:360px){.pad{gap:8px}.dpad{grid-template:repeat(3,45px)/repeat(3,45px)}.face{grid-template:repeat(3,42px)/repeat(3,42px)}}
</style>
<style>
.game-button{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;line-height:1.1}
.key-binding{font-size:10px;line-height:1.2;font-weight:400;opacity:.85;max-width:100%;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-button.awaiting{outline:3px solid #f4c16a;outline-offset:3px;background:#59482d}
.mapping-controls{padding-bottom:14px;border-bottom:1px solid #343b47}.mapping-controls button{font-size:14px}
#mappingHint{margin:10px 0 0;color:#f8c96a;font-size:14px;min-height:22px}
</style>
</head>
<body><main>
<header><div><p class="eyebrow">HOLOCUBIC / REMOTE</p><h1 data-t="title">网页手柄</h1></div><div class="header-tools"><label class="language-control" for="language"><span data-t="language">语言</span><select id="language" aria-label="语言"><option value="device" data-t="followDevice">跟随设备</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option><option value="ja">日本語</option></select></label><span id="status" class="badge" role="status">未接管</span></div></header>
<section class="panel"><div class="row"><button id="connect" class="primary" data-t="connect">接管手柄</button><button id="disconnect" data-t="disconnect" disabled>退出接管</button></div><p id="message" role="status">接管后，用下方按钮控制设备当前应用。</p></section>
<section class="panel" data-aria="padLabel">
<div class="mapping-controls"><div class="row"><button id="editMapping" aria-pressed="false" data-t="edit">键盘改键</button><button id="resetMapping" data-t="reset">恢复默认</button><button id="cancelMapping" data-t="cancelBind" hidden>取消本次绑定</button><button id="clearMapping" data-t="clearBind" hidden>清除该键绑定</button></div><p id="mappingHint" role="status">点击“键盘改键”，再点手柄按钮并按下要绑定的键。</p></div>
<div class="shoulders" aria-label="肩键"><button class="game-button" data-bit="256" disabled>LB</button><button class="game-button" data-bit="512" disabled>RB</button></div>
<div class="shoulders" style="margin-top:12px" aria-label="摇杆按键"><button class="game-button" data-bit="1024" disabled>L3</button><button class="game-button" data-bit="2048" disabled>R3</button></div>
<div class="pad"><div class="dpad"><button class="game-button up" data-bit="1" aria-label="上" disabled>↑</button><button class="game-button left" data-bit="4" aria-label="左" disabled>←</button><span class="hub" aria-hidden="true">＋</span><button class="game-button right" data-bit="8" aria-label="右" disabled>→</button><button class="game-button down" data-bit="2" aria-label="下" disabled>↓</button></div>
<div class="face"><button class="game-button x" data-bit="64" disabled>X</button><button class="game-button y" data-bit="128" disabled>Y</button><button class="game-button b" data-bit="32" disabled>B</button><button class="game-button a" data-bit="16" disabled>A</button></div></div>
<div class="aux" style="margin-top:12px"><button class="game-button" data-bit="4096" disabled>View</button><button class="game-button" data-bit="8192" disabled>Menu</button><button class="game-button" data-bit="16384" disabled>Share</button><button class="game-button" data-bit="32768" disabled>Home</button></div>
<div class="row" style="margin-top:14px"><button id="backLauncher" data-t="back">返回启动器</button></div>
<p class="hint" data-t="padHint">支持多指同时按、长按与松开。每个按钮下方显示键盘绑定，可自定义并自动保存在当前浏览器。LB/RB 为肩键，L3/R3 为摇杆按下；View 对应 SELECT，Menu 对应 START。黄金矿工：A 放钩，↓ 使用炸药，View 退出。</p>
</section>
<section class="panel"><p id="current">正在读取设备…</p><div class="row"><select id="apps" data-aria="chooseApp"><option value="">选择应用</option></select><button id="launch" data-t="open">打开</button></div><p class="hint" data-t="sessionHint">接管期间，实体蓝牙手柄暂停输入；退出接管后恢复。关闭页面、切到后台或断线后会自动松开。仅控制已支持手柄的应用。</p></section>
<footer class="footer"><a href="/hidpad/" data-t="settingsLink">蓝牙手柄设置</a><span class="author" data-t="author">作者：游侠173</span><span data-t="readyNote">设备 IP 即开即用</span></footer>
</main><script src="/hidpad/keyboard_mapping.js"></script><script src="/hidpad/remote.js"></script></body></html>
